# Liftoff XcodeGen 專案設定：產生 Liftoff.xcodeproj（macOS 26+、Swift 6、預設 MainActor 隔離）
name: Liftoff
options:
  bundleIdPrefix: com.firstfu
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  # App 內更新（issue #6）。沒有 Developer ID／公證，安全性靠 Sparkle 的 EdDSA 簽名，見 docs/context/reference/modules/updates.md
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Liftoff:
    type: application
    platform: macOS
    sources:
      - path: Liftoff
    info:
      path: Liftoff/Resources/Info.plist
      properties:
        CFBundleDisplayName: Liftoff
        CFBundleShortVersionString: "1.4.0"
        CFBundleVersion: "15"
        CFBundleDevelopmentRegion: en
        CFBundleAllowMixedLocalizations: true
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026 firstfu"
        # Sparkle：預設每週自動檢查並在背景下載安裝（實際開關由 AppSettings 套用；寫在這裡也讓 Sparkle 不跳「要不要自動檢查」的詢問）；
        # 更新檔須通過 EdDSA 簽名驗證才解壓
        SUFeedURL: https://firstfu.github.io/Liftoff/appcast.xml
        SUPublicEDKey: etYhDvQB9vFZMwUiulgeX9Hvuw+jyDG7ZO1RaoM+AAk=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 604800
        SUVerifyUpdateBeforeExtraction: true
        CFBundleURLTypes:
          - CFBundleURLName: com.firstfu.Liftoff
            CFBundleURLSchemes: [liftoff]
    dependencies:
      - package: Sparkle
    entitlements:
      path: Liftoff/Resources/Liftoff.entitlements
      properties:
        # 自簽憑證沒有 Team ID，hardened runtime 的 Library Validation 會拒絕載入 Sparkle.framework（實測 dyld：different Team IDs）
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.firstfu.Liftoff
        PRODUCT_NAME: Liftoff
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OPTIMIZATION_LEVEL_Release: -O
  LiftoffTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LiftoffTests
    dependencies:
      - target: Liftoff
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Liftoff.app/Contents/MacOS/Liftoff
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Liftoff:
    build:
      targets:
        Liftoff: all
    test:
      targets:
        - LiftoffTests
    run:
      config: Debug
